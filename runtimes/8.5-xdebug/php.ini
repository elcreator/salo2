[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

[xdebug]
; The debugger only attaches when the request asks for it, so the container
; stays usable as a normal runtime when no IDE is listening.
xdebug.mode = debug
xdebug.start_with_request = trigger
; The container talks back to the IDE on the host; 9003 is the port the
; accompanying "ports" file publishes.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = SALO
